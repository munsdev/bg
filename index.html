<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Backgrounds | muns.dev</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1420;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:clamp(32px,8vh,96px) clamp(16px,5vw,48px)}
.eyebrow{font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin:0 0 14px}
h1{margin:0 0 12px;font-size:clamp(36px,6vw,72px);line-height:1;letter-spacing:-.02em}
p.lead{margin:0 0 40px;max-width:46ch;opacity:.8;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;padding:20px;border:1px solid rgba(255,255,255,.18);border-radius:12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.04)}
a.card:hover,a.card:focus-visible{border-color:#e8a81c;outline:none}
a.card b{display:block;font-size:20px;margin-bottom:6px}
a.card span{opacity:.7;font-size:14px;line-height:1.4}
</style>
</head>
<body>
<main>
  <p class="eyebrow">bg.muns.dev</p>
  <h1>Backgrounds</h1>
  <p class="lead">Animated hero backgrounds. Open one, adjust it, export it.</p>
  <div class="grid" id="list"></div>
</main>
<script>
fetch('/effects.json').then(r => r.json()).then(list => {
  document.getElementById('list').innerHTML = list.map(e =>
    '<a class="card" href="' + e.path + '"><b>' + e.name + '</b><span>' + e.blurb + '</span></a>').join('');
});
</script>
</body>
</html>
